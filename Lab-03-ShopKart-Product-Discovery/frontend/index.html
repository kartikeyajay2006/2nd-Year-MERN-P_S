<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e0f" />
    <meta
      name="description"
      content="Thoughtfully curated electronics, fashion, books and home essentials. Discover, save and shop your everyday favorites with ShopKart."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ShopKart — Curated for the everyday</title>
    <script>
      try {
        const theme =
          localStorage.getItem("shopkart-theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0b0e0f" : "#f9f8f4";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
